# nginx.prod.conf
# Production Nginx configuration for KIOSK application
# Handles HTTPS, reverse proxy, static file serving, and S3 media fallback

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;  # Match MAX_FILE_SIZE in .env

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript;

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;  # Replace with your domain: kiosk.yourdomain.com

        location / {
            return 301 https://$host$request_uri;
        }

        # Allow Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;  # Replace with your domain: kiosk.yourdomain.com

        # SSL certificates (update paths after obtaining Let's Encrypt certs)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Serve frontend (React SPA)
        location / {
            proxy_pass http://kiosk-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SPA fallback - serve index.html for all routes
            proxy_intercept_errors on;
            error_page 404 = @frontend;
        }

        location @frontend {
            proxy_pass http://kiosk-frontend:80/index.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for SSE)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend:8000/health;
            proxy_set_header Host $host;
            access_log off;  # Don't log health checks
        }

        # API documentation
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OpenAPI JSON
        location /api/v1/openapi.json {
            proxy_pass http://backend:8000/api/v1/openapi.json;
            proxy_set_header Host $host;
        }

        # Media files - Serve from local storage
        # NOTE: Frontend handles S3 media loading directly via JavaScript
        # This location only serves local media when VITE_STORAGE_PROVIDER=local
        # When VITE_STORAGE_PROVIDER=s3, frontend loads directly from S3 CDN URL
        location /media/ {
            alias /var/kiosk/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # If file not found locally, return 404
            # Frontend will handle fallback to S3 if configured
            try_files $uri =404;
        }

        # Favicon
        location = /favicon.ico {
            proxy_pass http://kiosk-frontend:80/favicon.ico;
            access_log off;
            log_not_found off;
        }
    }
}